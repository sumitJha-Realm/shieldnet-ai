[tool.poetry]
name = "shieldnet-ai-backend"
version = "1.0.0"
description = "ShieldNet AI — Real-Time Malicious URL Detection Platform Backend"
authors = ["ShieldNet AI Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
motor = "^3.5.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
dnspython = "^2.6.0"
python-whois = "^0.9.4"
python-Levenshtein = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
